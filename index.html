<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vương Quốc Tri Thức - Bé Ôn Thi Lớp 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tri Thức">
  <link rel="apple-touch-icon" href="assets/mascot.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <!-- Nền trời & mây trôi -->
  <div class="sky-bg"></div>
  <div class="cloud-layer">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
  </div>
  <div class="confetti-box" id="confettiBox"></div>

  <!-- ================= MÀN HÌNH CHÍNH: BẢN ĐỒ VƯƠNG QUỐC ================= -->
  <section class="screen active" id="screenHome">
    <div class="topbar glass">
      <div class="tb-avatar" id="homeAvatar"></div>
      <div class="tb-info" id="profileBtn">
        <div class="tb-name">Chào <span id="kidName">BÉ YÊU</span></div>
        <div class="tb-level" id="kidLevel">Cấp 1 • Mầm Non Chăm Chỉ</div>
      </div>
      <div class="coin-pill"><span id="coinCount">0</span><i class="coin"></i></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Cài đặt">⚙️</button>
    </div>

    <div class="badge-strip glass" id="badgeStrip">
      <span class="bs-label">Bộ sưu tập huy hiệu</span>
      <span class="bs-items" id="badgeStripItems"></span>
    </div>

    <div class="title-wrap">
      <div class="title-plank">VƯƠNG QUỐC</div>
      <div class="title-puffy">TRI THỨC</div>
      <div class="title-sub">Ôn thi Học kỳ 1 • Lớp 1</div>
    </div>

    <div class="island-map" id="islandMap"></div>

    <nav class="bottom-nav glass">
      <button class="nav-item active" data-nav="home"><span class="nav-ic home-ic">🏠</span><span>Trang chủ</span></button>
      <button class="nav-item" data-nav="badges"><span class="nav-ic">🏅</span><span>Huy hiệu</span></button>
      <button class="nav-item" data-nav="shop"><span class="nav-ic">🛒</span><span>Cửa hàng</span></button>
      <button class="nav-item" data-nav="guide"><span class="nav-ic">❓</span><span>Hướng dẫn</span></button>
    </nav>
  </section>

  <!-- ================= MÀN HÌNH BẢN ĐỒ BÀI HỌC (CUỘN GIẤY) ================= -->
  <section class="screen" id="screenMap">
    <div class="map-top">
      <button class="back-btn" id="mapBackBtn" aria-label="Quay lại">‹</button>
      <div class="pill-white" id="mapSubjName">ĐẢO: TOÁN 1</div>
      <div class="pill-white"><span id="mapStars">0/0</span> ⭐</div>
    </div>
    <div class="scroll-paper">
      <div class="unit-path" id="unitPath"></div>
    </div>
  </section>

  <!-- ================= MÀN HÌNH CHƠI GAME ================= -->
  <section class="screen" id="screenGame">
    <div class="game-hud">
      <div class="hud-pill"><span class="hud-lbl">Điểm</span><b id="hudScore">0</b></div>
      <div class="hud-pill gold"><span class="hud-trophy">🏆</span>
        <div class="hud-bar"><div class="hud-bar-fill" id="hudBar"></div></div>
      </div>
      <button class="pause-btn" id="pauseBtn" aria-label="Tạm dừng">❚❚</button>
    </div>

    <div class="wood-board">
      <span class="vine v-left">🌿</span><span class="vine v-right">🍃</span>
      <div class="board-head" id="boardHead">Câu 1/8</div>
      <div class="board-body">
        <div class="board-lesson" id="boardLesson">Bài học</div>
        <div class="board-prompt-row">
          <div class="board-prompt" id="boardPrompt">...</div>
          <button class="speak-btn" id="speakBtn" aria-label="Đọc">🔊</button>
        </div>
      </div>
    </div>

    <div class="game-stage" id="gameStage"></div>

    <div class="mascot-row">
      <div class="mascot-img" id="mascotImg"></div>
      <div class="bubble" id="mascotBubble">Cùng chơi nào!</div>
    </div>
  </section>

  <!-- ================= MODAL CHỌN CHẾ ĐỘ CHƠI ================= -->
  <div class="overlay" id="modeOverlay">
    <div class="frost-panel">
      <div class="panel-title" id="modeTitle">Bài 1</div>
      <div class="mode-cards" id="modeCards"></div>
      <div class="panel-actions">
        <button class="btn-green" id="playBtn">Chơi ngay</button>
      </div>
      <button class="close-x" data-close="modeOverlay">✕</button>
    </div>
  </div>

  <!-- ================= MODAL KẾT QUẢ ================= -->
  <div class="overlay" id="resultOverlay">
    <div class="frost-panel result-panel">
      <div class="result-title" id="resultTitle">HOÀN THÀNH!</div>
      <div class="result-stars" id="resultStars"></div>
      <div class="result-score" id="resultScore">Điểm: 0</div>
      <div class="result-coins" id="resultCoins">+0 <i class="coin big"></i></div>
      <div class="panel-actions two">
        <button class="btn-orange" id="replayBtn">↻ Chơi lại</button>
        <button class="btn-green" id="toMapBtn">Bản đồ ➜</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL TẠM DỪNG ================= -->
  <div class="overlay" id="pauseOverlay">
    <div class="frost-panel small">
      <div class="panel-title">Tạm dừng</div>
      <div class="pause-mascot" id="pauseMascot"></div>
      <div class="panel-actions two">
        <button class="btn-orange" id="quitBtn">Thoát</button>
        <button class="btn-green" id="resumeBtn">Chơi tiếp</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL HUY HIỆU / CỬA HÀNG / HƯỚNG DẪN / CÀI ĐẶT ================= -->
  <div class="overlay" id="infoOverlay">
    <div class="frost-panel tall">
      <div class="panel-title" id="infoTitle">Huy hiệu</div>
      <div class="info-body" id="infoBody"></div>
      <button class="close-x" data-close="infoOverlay">✕</button>
    </div>
  </div>

  <script src="js/data.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
