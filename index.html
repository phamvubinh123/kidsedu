<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bé Vui Học Lớp 1 - Kết Nối Tri Thức</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bé Học Lớp 1">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #e0f2fe;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px 24px 12px;
      transition: background 0.3s ease;
      overflow-x: hidden;
    }
    body.theme-math { background: #ecfdf5; }
    body.theme-viet { background: #fff1f2; }
    body.theme-eng  { background: #eff6ff; }

    /* Top Gamification Header */
    .header {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 22px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.07);
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border: 3px solid #f1f5f9;
    }
    .player-info {
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .avatar-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fde047, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 3px 8px rgba(245, 158, 11, 0.35);
      margin-right: 10px;
      border: 2px solid #ffffff;
    }
    .level-box {
      display: flex;
      flex-direction: column;
    }
    .level-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
    }
    .xp-bar-wrap {
      width: 130px;
      height: 10px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 4px;
    }
    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }
    .stats-row {
      display: flex;
      align-items: center;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      background: #fffbeb;
      border: 2px solid #fde68a;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      color: #d97706;
      margin-left: 8px;
    }
    .stat-pill.streak-pill {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #e11d48;
    }
    .stat-pill.sticker-btn {
      background: #f3e8ff;
      border-color: #d8b4fe;
      color: #7e22ce;
      cursor: pointer;
    }
    .stat-pill.sticker-btn:active {
      transform: scale(0.95);
    }

    /* Subject Tabs (Toán, Tiếng Việt, Tiếng Anh) */
    .subject-tabs {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .subj-tab {
      flex: 1;
      margin: 0 4px;
      padding: 12px 8px;
      border-radius: 18px;
      border: 3px solid transparent;
      background: #ffffff;
      color: #475569;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: all 0.15s;
    }
    .subj-tab:first-child { margin-left: 0; }
    .subj-tab:last-child { margin-right: 0; }
    .subj-tab span.tab-icon {
      font-size: 24px;
      margin-right: 6px;
    }
    .subj-tab.active-math {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
      box-shadow: 0 5px 14px rgba(16, 185, 129, 0.35);
      transform: translateY(-2px);
    }
    .subj-tab.active-viet {
      background: #f43f5e;
      color: #ffffff;
      border-color: #e11d48;
      box-shadow: 0 5px 14px rgba(244, 63, 94, 0.35);
      transform: translateY(-2px);
    }
    .subj-tab.active-eng {
      background: #3b82f6;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 5px 14px rgba(59, 130, 246, 0.35);
      transform: translateY(-2px);
    }

    /* Topic Sub-navigation */
    .topic-nav {
      width: 100%;
      max-width: 760px;
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .topic-btn {
      flex-shrink: 0;
      margin-right: 8px;
      padding: 9px 14px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      font-size: 14px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .topic-btn.active {
      background: #1e293b;
      color: #ffffff;
      border-color: #0f172a;
    }
    body.theme-math .topic-btn.active { background: #059669; border-color: #047857; }
    body.theme-viet .topic-btn.active { background: #e11d48; border-color: #be123c; }
    body.theme-eng  .topic-btn.active { background: #2563eb; border-color: #1d4ed8; }

    /* Main Exercise Card */
    .card {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 26px;
      padding: 20px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 410px;
      position: relative;
      border: 3px solid #f1f5f9;
    }
    .card-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .lesson-tag {
      font-size: 13px;
      font-weight: 800;
      color: #059669;
      background: #d1fae5;
      padding: 5px 12px;
      border-radius: 16px;
      text-transform: uppercase;
    }
    body.theme-viet .lesson-tag { color: #e11d48; background: #ffe4e6; }
    body.theme-eng  .lesson-tag { color: #2563eb; background: #dbeafe; }

    .q-counter {
      font-size: 13px;
      font-weight: 800;
      color: #64748b;
      background: #f1f5f9;
      padding: 5px 10px;
      border-radius: 12px;
    }

    .prompt-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      width: 100%;
    }
    .question-prompt {
      font-size: 21px;
      font-weight: 800;
      text-align: center;
      color: #0f172a;
      line-height: 1.35;
    }
    .speak-btn {
      background: #fef08a;
      border: 2px solid #facc15;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
      margin-left: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .speak-btn:active {
      transform: scale(0.92);
    }

    /* Visual Display Area */
    .visual-area {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
      background: #f8fafc;
      padding: 16px 18px;
      border-radius: 20px;
      border: 3px dashed #cbd5e1;
      width: 100%;
      text-align: center;
    }
    .visual-icons {
      font-size: 44px;
      line-height: 1.3;
      letter-spacing: 4px;
    }
    .math-formula {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #1e3a8a;
    }
    .word-box {
      font-size: 36px;
      font-weight: 900;
      color: #be123c;
      background: #fff1f2;
      padding: 8px 22px;
      border-radius: 16px;
      border: 2px solid #fecdd3;
      margin-top: 6px;
    }
    .eng-word-box {
      font-size: 34px;
      font-weight: 900;
      color: #1d4ed8;
      background: #eff6ff;
      padding: 8px 22px;
      border-radius: 16px;
      border: 2px solid #bfdbfe;
      margin-top: 6px;
    }
    .poem-box {
      font-size: 19px;
      font-weight: 700;
      color: #334155;
      line-height: 1.55;
      background: #fffbeb;
      padding: 12px 18px;
      border-radius: 16px;
      border: 2px solid #fde68a;
      max-width: 560px;
    }

    /* Split/Merge Tree */
    .split-tree {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .split-top {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #10b981;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 3px 8px rgba(16, 185, 129, 0.3);
    }
    .split-lines {
      font-size: 22px;
      font-weight: 900;
      color: #64748b;
      line-height: 1;
      margin: 2px 0;
    }
    .split-branches {
      display: flex;
    }
    .split-bottom {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      border: 3px solid #3b82f6;
      margin: 0 18px;
    }

    /* Options Grid */
    .options-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
    }
    .opt-btn {
      width: 48.5%;
      margin-bottom: 12px;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-bottom-width: 6px;
      padding: 15px 10px;
      border-radius: 20px;
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: transform 0.1s, background 0.15s;
      min-height: 70px;
    }
    .opt-btn:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }
    .opt-btn.correct {
      background: #86efac !important;
      border-color: #16a34a !important;
      color: #064e3b !important;
      transform: scale(1.03);
    }
    .opt-btn.wrong {
      background: #fca5a5 !important;
      border-color: #dc2626 !important;
      color: #7f1d1d !important;
    }

    /* Mascot & Feedback Area */
    .feedback-bar {
      width: 100%;
      max-width: 600px;
      min-height: 54px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .feedback-msg {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
    }
    .feedback-msg.correct { color: #15803d; }
    .feedback-msg.wrong { color: #b91c1c; }

    .next-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: white;
      border: none;
      border-bottom: 4px solid #c2410c;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
    }
    .next-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    /* Sticker Album Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 540px;
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      border: 4px solid #fde047;
      text-align: center;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 900;
      color: #7e22ce;
      margin-bottom: 6px;
    }
    .modal-sub {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 16px;
    }
    .sticker-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 18px;
    }
    .sticker-slot {
      width: 72px;
      height: 78px;
      margin: 5px;
      border-radius: 16px;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .sticker-slot.unlocked {
      background: #fef9c3;
      border: 2px solid #facc15;
      box-shadow: 0 3px 8px rgba(250, 204, 21, 0.25);
    }
    .sticker-slot.locked {
      opacity: 0.4;
      filter: grayscale(100%);
    }
    .sticker-name {
      font-size: 10px;
      font-weight: 800;
      color: #475569;
      margin-top: 3px;
    }
    .close-modal-btn {
      background: #7e22ce;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 17px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
    }

    /* Floating Celebration Particles */
    .confetti-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      font-size: 28px;
      animation: fallDown 1.4s ease-out forwards;
    }
    @keyframes fallDown {
      0% { transform: translateY(-20px) scale(0.5) rotate(0deg); opacity: 1; }
      100% { transform: translateY(320px) scale(1.2) rotate(360deg); opacity: 0; }
    }

    @media (max-width: 520px) {
      .opt-btn { width: 100%; min-height: 60px; font-size: 21px; padding: 12px 10px; }
      .subj-tab { font-size: 15px; padding: 10px 4px; }
      .question-prompt { font-size: 18px; }
      .visual-icons { font-size: 36px; }
      .math-formula { font-size: 34px; }
    }
  </style>
</head>
<body class="theme-math">

  <div class="confetti-container" id="confettiBox"></div>

  <!-- Gamification Header (Đã bỏ đồng hồ Pomodoro) -->
  <div class="header">
    <div class="player-info" id="avatarBtn" title="Chạm để đổi nhân vật">
      <div class="avatar-circle" id="avatarIcon">🦁</div>
      <div class="level-box">
        <div class="level-title" id="levelTitle">Cấp 1: Bé Tập Sự</div>
        <div class="xp-bar-wrap">
          <div class="xp-bar-fill" id="xpBarFill"></div>
        </div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-pill">
        <span>⭐</span>&nbsp;<span id="starCount">0</span>
      </div>
      <div class="stat-pill streak-pill">
        <span>🔥</span>&nbsp;<span id="streakCount">0</span>
      </div>
      <div class="stat-pill sticker-btn" id="openStickerBtn">
        <span>🎁</span>&nbsp;<span id="badgeCount">0/16</span>
      </div>
    </div>
  </div>

  <!-- 3 Subject Tabs: Toán, Tiếng Việt, Tiếng Anh -->
  <div class="subject-tabs">
    <button class="subj-tab active-math" data-subj="math">
      <span class="tab-icon">🔢</span> Toán 1
    </button>
    <button class="subj-tab" data-subj="viet">
      <span class="tab-icon">📖</span> Tiếng Việt 1
    </button>
    <button class="subj-tab" data-subj="eng">
      <span class="tab-icon">🔤</span> Tiếng Anh 1
    </button>
  </div>

  <!-- Dynamic Sub-topic Navigation -->
  <div class="topic-nav" id="topicNav"></div>

  <!-- Main Exercise Card -->
  <div class="card">
    <div class="card-top-bar">
      <div class="lesson-tag" id="lessonTag">BÀI TẬP SGK</div>
      <div class="q-counter" id="qCounter">Câu 1/10</div>
    </div>

    <div class="prompt-row">
      <div class="question-prompt" id="questionPrompt">Đang tải câu hỏi...</div>
      <button class="speak-btn" id="speakBtn" title="Đọc câu hỏi">🔊</button>
    </div>

    <div class="visual-area" id="visualArea"></div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="feedback-bar">
      <div class="feedback-msg" id="feedbackMsg"></div>
      <button class="next-btn" id="nextBtn">Tiếp theo ➜</button>
    </div>
  </div>

  <!-- Sticker Album Modal -->
  <div class="modal-overlay" id="stickerModal">
    <div class="modal-box">
      <div class="modal-title">🏆 Bộ Sưu Tập Huy Hiệu</div>
      <div class="modal-sub">Cứ mỗi 5 ⭐ ngôi sao, bé sẽ mở khóa 1 bạn thú cưng mới!</div>
      <div class="sticker-grid" id="stickerGrid"></div>
      <button class="close-modal-btn" id="closeStickerBtn">Đóng lại</button>
    </div>
  </div>

  <script>
    // =====================================================
    // 1. WEB AUDIO API & SPEECH SYNTHESIS (iOS Safari Safe)
    // =====================================================
    var AudioKit = {
      ctx: null,
      init: function() {
        if (!this.ctx) {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      },
      playTone: function(freq, type, startOffset, duration, vol) {
        if (!this.ctx) return;
        var now = this.ctx.currentTime + startOffset;
        var osc = this.ctx.createOscillator();
        var gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(vol || 0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.start(now);
        osc.stop(now + duration);
      },
      playClick: function() {
        this.init();
        this.playTone(600, "sine", 0, 0.06, 0.15);
      },
      playSuccess: function() {
        this.init();
        this.playTone(523.25, "triangle", 0.00, 0.14, 0.28); // C5
        this.playTone(659.25, "triangle", 0.09, 0.14, 0.28); // E5
        this.playTone(783.99, "triangle", 0.18, 0.14, 0.28); // G5
        this.playTone(1046.50, "sine",    0.27, 0.30, 0.32); // C6
      },
      playLevelUp: function() {
        this.init();
        var notes = [523.25, 587.33, 659.25, 783.99, 1046.50, 1318.51];
        for (var i = 0; i < notes.length; i++) {
          this.playTone(notes[i], "triangle", i * 0.08, 0.22, 0.3);
        }
      },
      playWrong: function() {
        this.init();
        this.playTone(220, "sawtooth", 0.00, 0.16, 0.2);
        this.playTone(165, "sawtooth", 0.14, 0.24, 0.2);
      },
      speak: function(text, lang) {
        if (!("speechSynthesis" in window)) return;
        try {
          window.speechSynthesis.cancel();
          var utter = new SpeechSynthesisUtterance(text);
          utter.lang = lang || "vi-VN";
          utter.rate = 0.9;
          window.speechSynthesis.speak(utter);
        } catch (e) {}
      }
    };

    // =====================================================
    // 2. GAMIFICATION DATA (Stickers & Levels)
    // =====================================================
    var STICKERS = [
      { icon: "🦁", name: "Sư Tử" },
      { icon: "🐼", name: "Gấu Trúc" },
      { icon: "🦊", name: "Cáo Đỏ" },
      { icon: "🐰", name: "Thỏ Trắng" },
      { icon: "🐯", name: "Hổ Vàng" },
      { icon: "🐨", name: "Koala" },
      { icon: "🐸", name: "Ếch Xanh" },
      { icon: "🐵", name: "Khỉ Con" },
      { icon: "🦄", name: "Kỳ Lân" },
      { icon: "🦖", name: "Khủng Long" },
      { icon: "🐬", name: "Cá Heo" },
      { icon: "🦉", name: "Cú Mèo" },
      { icon: "🦋", name: "Bướm Xinh" },
      { icon: "🐢", name: "Rùa Nhỏ" },
      { icon: "🚀", name: "Tên Lửa" },
      { icon: "👑", name: "Vua Học Tập" }
    ];

    var LEVEL_NAMES = [
      "Cấp 1: Mầm Non Chăm Chỉ",
      "Cấp 2: Bé Ngoan Hiếu Học",
      "Cấp 3: Ong Nhỏ Thông Thái",
      "Cấp 4: Nhà Thám Hiểm Nhí",
      "Cấp 5: Ngôi Sao Lớp 1",

    var stickerGridEl = document.getElementById("stickerGrid");

    function updateHeaderUI() {
      starCountEl.innerText = stars;
      streakCountEl.innerText = streak;

      var unlockedCount = Math.min(STICKERS.length, Math.floor(stars / 5) + 1);
      badgeCountEl.innerText = unlockedCount + "/" + STICKERS.length;

      if (avatarIdx >= unlockedCount) avatarIdx = 0;
      avatarIconEl.innerText = STICKERS[avatarIdx].icon;

      var levelIdx = Math.min(LEVEL_NAMES.length - 1, Math.floor(stars / 10));
      levelTitleEl.innerText = LEVEL_NAMES[levelIdx];

      var xpPercent = (stars % 10) * 10;
      xpBarFillEl.style.width = xpPercent + "%";
    }

    function spawnConfetti() {
      var emojis = ["🌟", "🎉", "✨", "🎈", "🏆", "💖", "🍭"];
      for (var i = 0; i < 12; i++) {
        var el = document.createElement("div");
        el.className = "confetti-piece";
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.floor(Math.random() * 90 + 5) + "%";
        el.style.top = Math.floor(Math.random() * 20) + "%";
        el.style.animationDelay = (Math.random() * 0.25) + "s";
        confettiBoxEl.appendChild(el);
        (function(node) {
          setTimeout(function() {
            if (node && node.parentNode) node.parentNode.removeChild(node);
          }, 1500);
        })(el);
      }
    }

    function renderTopicBar() {
      topicNavEl.innerHTML = "";
      var topics = TOPICS_BY_SUBJECT[currentSubj] || [];
      for (var i = 0; i < topics.length; i++) {
        var btn = document.createElement("button");
        btn.className = "topic-btn" + (topics[i].id === currentTopic ? " active" : "");
        btn.innerText = topics[i].label;
        btn.setAttribute("data-topic", topics[i].id);
        btn.onclick = function() {
          AudioKit.playClick();
          currentTopic = this.getAttribute("data-topic");
          renderTopicBar();
          filterQuestions();
        };
        topicNavEl.appendChild(btn);
      }
    }

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = arr[i];
        arr[i] = arr[j];
        arr[j] = temp;
      }
    }

    function filterQuestions() {
      var bank = QUESTION_BANK[currentSubj] || [];
      if (currentTopic === "all") {
        filteredList = bank.slice();
      } else {
        filteredList = [];
        for (var i = 0; i < bank.length; i++) {
          if (bank[i].topic === currentTopic) {
            filteredList.push(bank[i]);
          }
        }
      }
      shuffle(filteredList);
      currentIndex = 0;
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      feedbackMsgEl.innerText = "";
      feedbackMsgEl.className = "feedback-msg";
      nextBtnEl.style.display = "none";
      optionsGridEl.innerHTML = "";
      visualAreaEl.innerHTML = "";

      if (filteredList.length === 0) {
        promptEl.innerText = "Chưa có câu hỏi cho mục này.";
        return;
      }

      var q = filteredList[currentIndex];
      lessonTagEl.innerText = q.lesson;
      qCounterEl.innerText = "Câu " + (currentIndex + 1) + "/" + filteredList.length;
      promptEl.innerText = q.prompt;

      // Render Visual Area
      if (q.visualType === "icons") {
        var iconDiv = document.createElement("div");
        iconDiv.className = "visual-icons";
        iconDiv.innerText = q.visual;
        visualAreaEl.appendChild(iconDiv);
      } else if (q.visualType === "formula") {
        var span = document.createElement("div");
        span.className = "math-formula";
        span.innerText = q.visual;
        visualAreaEl.appendChild(span);
      } else if (q.visualType === "split") {
        var tree = document.createElement("div");
        tree.className = "split-tree";
        tree.innerHTML =
          '<div class="split-top">' + q.visualData.top + '</div>' +
          '<div class="split-lines">↙ &nbsp;&nbsp;&nbsp; ↘</div>' +
          '<div class="split-branches">' +
            '<div class="split-bottom">' + q.visualData.left + '</div>' +
            '<div class="split-bottom">' + q.visualData.right + '</div>' +
          '</div>';
        visualAreaEl.appendChild(tree);
      } else if (q.visualType === "word") {
        var topIcon = document.createElement("div");
        topIcon.className = "visual-icons";
        topIcon.innerText = q.visual;
        var wBox = document.createElement("div");
        wBox.className = "word-box";
        wBox.innerText = q.word;
        visualAreaEl.appendChild(topIcon);
        visualAreaEl.appendChild(wBox);
      } else if (q.visualType === "poem") {
        var pBox = document.createElement("div");
        pBox.className = "poem-box";
        pBox.innerText = q.visual;
        visualAreaEl.appendChild(pBox);
      } else if (q.visualType === "eng") {
        var eIcon = document.createElement("div");
        eIcon.className = "visual-icons";
        eIcon.innerText = q.visual;
        var eBox = document.createElement("div");
        eBox.className = "eng-word-box";
        eBox.innerText = q.word;
        visualAreaEl.appendChild(eIcon);
        visualAreaEl.appendChild(eBox);
      }

      // Shuffle Options so child doesn't memorize position
      var opts = q.options.slice();
      shuffle(opts);
      for (var i = 0; i < opts.length; i++) {
        var btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = opts[i];
        btn.setAttribute("data-val", opts[i]);
        btn.onclick = function() {
          handleSelect(this, q);
        };
        optionsGridEl.appendChild(btn);
      }
    }

    var PRAISE_MESSAGES = [
      "Giỏi quá! Bé được thưởng 1 ⭐!",
      "Xuất sắc luôn! Tiếp tục phát huy nhé! 🎉",
      "Chuẩn không cần chỉnh! Siêu quá! 🏆",
      "Tuyệt vời! Bé thông minh lắm! 🌟"
    ];

    function handleSelect(selectedBtn, q) {
      if (answered) return;
      answered = true;

      var chosenVal = selectedBtn.getAttribute("data-val");
      var allButtons = optionsGridEl.querySelectorAll(".opt-btn");

      if (chosenVal === q.answer) {
        selectedBtn.classList.add("correct");
        var oldUnlocked = Math.floor(stars / 5);
        stars += 1;
        streak += 1;
        var newUnlocked = Math.floor(stars / 5);

        saveProgress();
        updateHeaderUI();

        if (newUnlocked > oldUnlocked && newUnlocked < STICKERS.length) {
          AudioKit.playLevelUp();
          spawnConfetti();
          feedbackMsgEl.innerText = "🎁 Mở khóa thú cưng mới: " + STICKERS[newUnlocked].icon + " " + STICKERS[newUnlocked].name + "!";
        } else {
          AudioKit.playSuccess();
          if (streak % 3 === 0) spawnConfetti();
          var msg = PRAISE_MESSAGES[Math.floor(Math.random() * PRAISE_MESSAGES.length)];
          feedbackMsgEl.innerText = msg;
        }
        feedbackMsgEl.className = "feedback-msg correct";

        if (currentSubj === "eng" && q.speakText) {
          AudioKit.speak(q.speakText, "en-US");
        }
      } else {
        selectedBtn.classList.add("wrong");
        streak = 0;
        updateHeaderUI();
        feedbackMsgEl.innerText = "Chưa đúng rồi, đáp án là: " + q.answer + " 💪";
        feedbackMsgEl.className = "feedback-msg wrong";
        AudioKit.playWrong();

        for (var i = 0; i < allButtons.length; i++) {
          if (allButtons[i].getAttribute("data-val") === q.answer) {
            allButtons[i].classList.add("correct");
          }
        }
      }
      nextBtnEl.style.display = "inline-block";
    }

    // =====================================================
    // 7. EVENT LISTENERS
    // =====================================================
    nextBtnEl.onclick = function() {
      AudioKit.playClick();
      currentIndex++;
      if (currentIndex >= filteredList.length) {
        currentIndex = 0;
        shuffle(filteredList);
      }
      loadQuestion();
    };

    speakBtnEl.onclick = function() {
      AudioKit.playClick();
      if (filteredList.length === 0) return;
      var q = filteredList[currentIndex];
      if (currentSubj === "eng" && q.speakText) {
        AudioKit.speak(q.speakText, "en-US");
      } else {
        AudioKit.speak(q.prompt, "vi-VN");
      }
    };

    // Subject Tabs Switching
    var subjTabs = document.querySelectorAll(".subj-tab");
    for (var i = 0; i < subjTabs.length; i++) {
      subjTabs[i].onclick = function() {
        AudioKit.playClick();
        var s = this.getAttribute("data-subj");
        currentSubj = s;
        currentTopic = "all";

        // Update body theme & tab active classes
        document.body.className = "theme-" + s;
        for (var j = 0; j < subjTabs.length; j++) {
          subjTabs[j].className = "subj-tab";
        }
        this.className = "subj-tab active-" + s;

        renderTopicBar();
        filterQuestions();
      };
    }

    // Sticker Modal & Avatar Selection
    function renderStickerModal() {
      stickerGridEl.innerHTML = "";
      var unlockedCount = Math.min(STICKERS.length, Math.floor(stars / 5) + 1);
      for (var i = 0; i < STICKERS.length; i++) {
        var isUnlocked = i < unlockedCount;
        var slot = document.createElement("div");
        slot.className = "sticker-slot " + (isUnlocked ? "unlocked" : "locked");
        slot.innerHTML =
          '<div>' + STICKERS[i].icon + '</div>' +
          '<div class="sticker-name">' + (isUnlocked ? STICKERS[i].name : (i * 5) + " ⭐") + '</div>';
        if (isUnlocked) {
          slot.setAttribute("data-idx", String(i));
          slot.style.cursor = "pointer";
          slot.onclick = function() {
            AudioKit.playClick();
            avatarIdx = parseInt(this.getAttribute("data-idx"), 10) || 0;
            saveProgress();
            updateHeaderUI();
            stickerModalEl.className = "modal-overlay";
          };
        }
        stickerGridEl.appendChild(slot);
      }
    }

    document.getElementById("openStickerBtn").onclick = function() {
      AudioKit.playClick();
      renderStickerModal();
      stickerModalEl.className = "modal-overlay open";
    };

    document.getElementById("avatarBtn").onclick = function() {
      AudioKit.playClick();
      renderStickerModal();
      stickerModalEl.className = "modal-overlay open";
    };

    document.getElementById("closeStickerBtn").onclick = function() {
      AudioKit.playClick();
      stickerModalEl.className = "modal-overlay";
    };

    // Init App
    loadProgress();
    renderTopicBar();
    filterQuestions();
  </script>
</body>
</html>
